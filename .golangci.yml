#
# golangci-lint v2 configuration for readeckorator.
#
# v2 enables all linters by default; we explicitly enable the
# ones we want (and pin their comments). The v2 schema moved
# exclusions under `linters.exclusions`:
#   - paths:  directories or files to skip
#   - rules:  per-linter/text/path exclusions

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck                # unchecked errors
    - govet                  # suspicious constructs
    - ineffassign            # unused assignments
    - staticcheck            # bug finder (includes stylecheck in v2)
    - unused                 # dead code
    - gosec                  # security
    - gocritic               # opinionated style + bugs
    - gocheckcompilerdirectives # unknown //go: directives
    - errorlint              # %w wrapping correctness
    - bodyclose              # http body close
    - nilerr                 # returning nil after handling error
    - nilnil                 # func() (nil, nil) anti-pattern
  exclusions:
    # Don't lint inside the goreleaser build output or our local bin/.
    paths:
      - dist
      - bin
    # We allow errcheck/gosec to be noisy on test files (test
    # helpers often swallow errors on purpose) and accept
    # gocritic's "function-parameter" complaint in test args.
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - path: _test\.go
        text: "function-parameter"
        linters: [gocritic]

issues:
  max-same-issues: 0
