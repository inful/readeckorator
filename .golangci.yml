#
# golangci-lint v2 configuration for readeckorator.
#
# v2 enables all linters by default; we explicitly disable ones
# we don't want and pin the rest. The config is checked by the
# CI job "Run golangci-lint" before the actual lint runs.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck                # unchecked errors
    - govet                  # suspicious constructs
    - ineffassign            # unused assignments
    - staticcheck            # bug finder (includes stylecheck in v2)
    - unused                 # dead code
    - gosec                  # security
    - gocritic               # opinionated style + bugs
    - gocheckcompilerdirectives # unknown //go: directives
    - errorlint              # %w wrapping correctness
    - bodyclose              # http body close
    - nilerr                 # returning nil after handling error
    - nilnil                 # func() (nil, nil) anti-pattern

issues:
  max-same-issues: 0
  # Path excludes for the Go toolchain — keeps generated files
  # and the goreleaser dist directory out of the lint universe.
  exclude-dirs:
    - dist
    - bin
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    - path: _test\.go
      text: "function-parameter"
      linters: [gocritic]
