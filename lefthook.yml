# lefthook configuration for readeckorator.
#
# All gates block the commit unless they pass. No --no-verify escape
# hatch: we want to know immediately if anything is broken.
#
# Conventional Commits are enforced by a pure-bash regex check on the
# commit message via hack/commitlint.sh — no Node, no commitlint.

min_version: 1.6.0

pre-commit:
  parallel: true
  commands:
    test:
      glob: "*.go"
      run: go test ./...
    vet:
      glob: "*.go"
      run: go vet ./...
    lint:
      glob: "*.go"
      run: golangci-lint run
    sqlc:
      glob: "*.sql"
      run: if [ -f sqlc.yaml ]; then sqlc generate && git diff --exit-code -- internal/state/queries.sql.go internal/state/models.go || { echo "sqlc generated code is out of date — run 'make sqlc' and commit the result"; exit 1; }; else echo "sqlc.yaml not present — skipping"; fi

commit-msg:
  commands:
    conventional:
      run: hack/commitlint.sh {1}
