# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI checks for every PR and push to main. Mirrors the local
# `make verify` gate so reviewers can trust the green check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Install sqlc at the version pinned in go.sum / sqlc.yaml.
      # sqlc is a Go binary; using the official install action keeps
      # the workflow hermetic — no apt, no brew.
      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v3
        with:
          sqlc-version: "1.28.0"

      - name: Run sqlc
        run: make sqlc

      - name: Verify sqlc output is up to date
        run: |
          sqlc generate
          git diff --exit-code -- internal/state/queries.sql.go internal/state/models.go

      - name: Run tests
        run: make test

      - name: Run tests with race detector
        run: make test-race

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2

      - name: Build
        run: make build
